name: PhiSafe checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check app.js
          node --check core.mjs
          node --check rung2.mjs
          node --check rung2-ui.mjs
          node --check rung3.mjs
          node --check rung3-ui.mjs
          node --check rung4.mjs
          node --check rung4-ui.mjs
          node --check sw.js
      - name: Unit tests
        run: node --test tests/*.test.mjs
